name: CI

# SPEC N-06。**GPU 学習そのものは CI の必須工程にしない** ——
# 学習は 22 fold で数時間かかり、素材(3.6 GB)も要る。CI が見るのは
# 「リポジトリにあるものだけで成立する検査」に限る。
#
# 素材(dataset/raw)を持たない環境では、それを要求する検査は skip する設計にしてある
# (tests/test_splits.py の _require)。素材がある環境では skip ではなく fail する ——
# skip にすると、生成器が黙って出力しなくなったときに検査が緑のまま通る。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存を入れる
        # 検査が実行時に読み込むものだけを入れる。**一覧は手で決めない** ——
        # 検査 T-260(tests/test_ci_deps.py)が、tests/ の構文木(関数の中の import を含む)と
        # 検査が読み込む ml モジュールのモジュール水準の import から数え、ここと突き合わせる。
        #
        # loop_007 では grep で行頭の import だけを数えて torch / scipy / pillow を落とした。
        # T-256(Grad-CAM の手計算オラクル)が関数の中で import torch していたためで、
        # 手元の venv には torch があるので緑に見え、CI は一度も走っていなかった(HC-269)。
        # torch は CPU 版で足りる(GPU 学習は CI の仕事ではない)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy scikit-learn scipy pillow
      - name: 検査
        run: python -m pytest -q
      - name: 字種検査
        run: python harness/text_hygiene.py SPEC.md TEST_SPEC.md README.md AGENTS.md DATA_LICENSE.md docs reports
      - name: ループログの検証
        run: python harness/looplog.py validate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 実行系を梱包する
        run: node scripts/pack.mjs
      - name: 型検査
        run: npm run typecheck
      - name: 単体検査
        run: npm test
      - name: 静的書き出し
        run: npx next build
      - name: 出荷物の検査
        # ビルドの後にもう一度回す。tests/bundle.test.ts は out/ の中身を見るので、
        # ビルド前に走らせても skip されてしまう
        run: npm test
